<!DOCTYPE html>
<html lang="fr">
<head>
		<title>Calameo PDF Downloader</title>
		
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<meta
			name="title"
			content="Calameo PDF Downloader"
		/>
		
		<meta
			name="description"
			content="Convertis et télécharge facilement un document Calameo au format PDF directement depuis ton navigateur."
		/>
		
		<meta property="og:type" content="website" />
		
		<meta
			property="og:url"
			content="https://calameo-download-pdf-lac.vercel.app/"
		/>
		
		<meta
			property="og:title"
			content="Calameo PDF Downloader"
		/>
		
		<meta
			property="og:description"
			content="Convertis et télécharge facilement un document Calameo au format PDF directement depuis ton navigateur."
		/>
		
		<meta
			property="og:image"
			content="https://calameo-download-pdf-lac.vercel.app/calameo-pdf-dl.jpeg"
		/>
		
		<meta
			property="og:image:alt"
			content="Calameo PDF Downloader"
		/>

	<style>
		:root {
			--background: #000000;
			--foreground: #fafafa;
			--muted: #111111;
			--muted-foreground: #a1a1aa;
			--border: #27272a;
			--input: #18181b;
			--ring: #fafafa;
			--primary: #fafafa;
			--primary-foreground: #000000;
			--destructive: #ef4444;
			--radius: 9999px;
			--font-sans: Verdana, Geneva, Tahoma, sans-serif;
			--height-control: 2.5rem;
		}

		/* ── Reset & Base ── */
		*, *::before, *::after {
			box-sizing: border-box;
		}

	html {
			background-color: var(--background);
			color: var(--foreground);
	}

		body {
			max-width: 768px;
			margin: 0 auto;
			width: 100%;
			padding: 0;
			min-height: 100dvh;
			font-family: var(--font-sans);
			font-size: 14px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			text-align: center;
			display: flex;
			flex-direction: column;
		}

		/* ── Layout ── */
		.screen {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 2rem 1rem;
			flex: 1;
		}

		p,
		form,
		label {
			width: 100%;
			max-width: 28rem;
		}

		/* ── Logo ── */
		.logo {
			width: 100%;
			max-width: 20rem;
			height: auto;
			margin-bottom: 1rem;
		}

		/* ── Description ── */
		p {
			margin: 0 0 1.5rem;
			font-size: 0.8125rem;
			color: var(--muted-foreground);
		}

		/* ── Form ── */
		form {
			display: flex;
			align-items: center;
			gap: 1rem;
		}

		/* ── Input ── */
		input[type="url"] {
			flex: 1;
			min-width: 0;
			height: var(--height-control);
			padding: 0 1rem;

			background-color: var(--input);
			color: var(--foreground);

			border: 1px solid var(--border);
			border-radius: var(--radius);

			font-family: var(--font-sans);
			font-size: 0.875rem;

			outline: none;
			transition:
				border-color 0.15s,
				box-shadow 0.15s;
		}

		input[type="url"]::placeholder {
			color: var(--muted-foreground);
			font-style: italic;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		input[type="url"]:focus {
			border-color: var(--ring);
			box-shadow:
				0 0 0 2px var(--background),
				0 0 0 4px var(--ring);
		}

		/* ── Button ── */
		button[type="submit"] {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 4px;

			flex-shrink: 0;

			width: var(--height-control);
			height: var(--height-control);
			padding: 0;

			background-color: var(--primary);
			color: var(--primary-foreground);

			border: none;
			border-radius: var(--radius);

			cursor: pointer;
			white-space: nowrap;

			transition:
				opacity 0.15s,
				width 0.2s;
		}

		button[type="submit"]:hover {
			opacity: 0.88;
		}

		button[type="submit"]:active {
			opacity: 0.76;
		}

		button[type="submit"]:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

		button[type="submit"]:focus-visible {
			outline: none;
			box-shadow:
				0 0 0 2px var(--background),
				0 0 0 4px var(--ring);
		}

		button.counting {
			width: auto;
			padding: 0 0.75rem;
			font-size: 0.75rem;
			font-weight: 600;
		}

		/* ── Error ── */
		label {
			display: none;
			margin-top: 0.75rem;
			font-size: 0.8125rem;
			color: var(--destructive);
		}

		label.error {
			display: block;
		}

		/* ── Print ── */
		.print img {
			display: none;
		}
		
		.info {
			width: 100%;
			margin: 1.25rem 0 1.25rem;
		
			font-size: 0.65rem;
			line-height: 1.4;
			color: var(--muted-foreground);
		
			padding: 0.75rem 1rem;
			border-radius: 20px;
		
			background-color: var(--muted);
		
			text-align: left;
		}
		
		/* ── Footer ── */
		.footer {
			max-width: 768px;
			margin: auto;
			width: 100%;
			padding: 1rem 1.25rem;
			display: flex;
			justify-content: items-center;
			align-items: center;
			gap: 0.5rem;
			color: var(--muted-foreground);
			font-size: 0.75rem;
		}
		
		.footer a {
			color: var(--muted-foreground);
			text-decoration: none;
			transition: opacity 0.15s;
		}
		
		.footer a:hover {
			opacity: 0.8;
		}
		
		/* séparateur vertical */
		.footer .dot {
			margin: 0 0.25rem;
		}

		@media print {
			.print img {
				display: block;
				width: 100%;
				max-height: 100vh;
				page-break-after: always;
				page-break-inside: avoid;
			}

			.screen {
				display: none;
			}
		}

		/* ── Loader ── */
		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		.spin {
			animation: spin 0.8s linear infinite;
		}
	</style>

	<style id="pageStyle"></style>
</head>

<body>
	<div class="screen">
		<img
			src="calameo-pdf-dl.jpeg"
			alt="Calameo PDF Downloader"
			class="logo"
		>

		<p>Obtiens un PDF depuis ton document Calameo</p>

		<form id="download-form">
			<input
				type="url"
				required
				placeholder="https://www.calameo.com/calameo/read/00000000197005f4f7c58"
			>

			<button type="submit" aria-label="Télécharger">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
					viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round"
					stroke-linejoin="round">
					<path d="M5 12h14"/>
					<path d="m12 5 7 7-7 7"/>
				</svg>
			</button>
		</form>

		<label id="error-label"></label>

	
	<p class="info">
		Pour un rendu optimal du PDF, utilisez de préférence Chrome ou un navigateur basé sur Chromium.
	</p>
	</div>
	<div class="print" id="images"></div>
	
	<footer class="footer">
		<a href="https://github.com/jorisre/calameo-download-pdf" target="_blank" rel="noopener noreferrer">
			GitHub
		</a>
	
		<span class="dot">•</span>
	
		<a href="https://github.com/ComFoxx/calameo-download-pdf" target="_blank" rel="noopener noreferrer">
			Projet basé sur ComFoxx
		</a>
	</footer>

	<script type="module">
		/* ───────────────────────────────
		   Constants
		─────────────────────────────── */

		const APP_TITLE = 'Calameo Download PDF';
		const MAX_ERROR_RESPONSE_LENGTH = 500;

		const ICON_ARROW = `
			<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
				viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round"
				stroke-linejoin="round">
				<path d="M5 12h14"/>
				<path d="m12 5 7 7-7 7"/>
			</svg>
		`;

		const ICON_LOADER = `
			<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
				viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round"
				stroke-linejoin="round" class="spin">
				<path d="M12 2v4"/>
				<path d="m16.2 7.8 2.9-2.9"/>
				<path d="M18 12h4"/>
				<path d="m16.2 16.2 2.9 2.9"/>
				<path d="M12 18v4"/>
				<path d="m4.9 19.1 2.9-2.9"/>
				<path d="M2 12h4"/>
				<path d="m4.9 4.9 2.9 2.9"/>
			</svg>
		`;

		/* ───────────────────────────────
		   DOM
		─────────────────────────────── */

		const dom = {
			form: document.querySelector('#download-form'),
			input: document.querySelector('input'),
			button: document.querySelector('button[type="submit"]'),
			error: document.querySelector('#error-label'),
			images: document.querySelector('#images'),
			pageStyle: document.querySelector('#pageStyle'),
			title: document.querySelector('title')
		};

		/* ───────────────────────────────
		   UI
		─────────────────────────────── */

		function setLoading(isLoading) {
			dom.button.disabled = isLoading;
			dom.button.classList.remove('counting');
			dom.button.innerHTML = isLoading
				? ICON_LOADER
				: ICON_ARROW;
		}

		function setCounter(current, total) {
			dom.button.disabled = true;
			dom.button.classList.add('counting');

			dom.button.innerHTML = `
				${ICON_LOADER}<span>${current}/${total}</span>
			`;
		}

		function showError(message, error = null) {
			dom.error.textContent = `Erreur : ${message}`;
			dom.error.classList.add('error');

			setLoading(false);

			if (error) {
				console.error(error);
			}
		}

		function clearError() {
			dom.error.textContent = '';
			dom.error.classList.remove('error');
		}

		function clearImages() {
			dom.images.replaceChildren();
		}

		/* ───────────────────────────────
		   Helpers
		─────────────────────────────── */

		function getBookCode(urlString) {
			let url;

			try {
				url = new URL(urlString);
			} catch {
				throw new Error(`L'URL saisie est invalide.`);
			}

			const parts = url.pathname
				.split('/')
				.filter(Boolean);

			const bkcode = parts.at(-1);

			if (!bkcode) {
				throw new Error(
					`Le code du document Calameo est introuvable dans l'URL saisie.`
				);
			}

			return {
				bkcode,
				searchParams: url.searchParams
			};
		}

		function buildApiUrl(bkcode, searchParams) {
			const params = new URLSearchParams(searchParams);
			params.set('bkcode', bkcode);

			return `/api/getbook.php?${params}`;
		}

		function validateHeaders(headers) {
			const requiredHeaders = {
				expires: headers.get('X-Calameo-Hash-Expires'),
				path: headers.get('X-Calameo-Hash-Path'),
				signature: headers.get('X-Calameo-Hash-Signature')
			};

			const missing = Object.entries(requiredHeaders)
				.filter(([, value]) => !value)
				.map(([key]) => key);

			if (missing.length) {
				throw new Error(
					`En-têtes Calameo manquants : ${missing.join(', ')}.`
				);
			}

			return requiredHeaders;
		}

		function setPrintPageSize(width, height) {
			dom.pageStyle.textContent = `
				@page {
					size: ${width}px ${height}px;
					margin: 0;
				}
			`;
		}

		async function fetchBook(url) {
			const response = await fetch(url);
			const text = await response.text();

			if (!text.trim()) {
				throw new Error(
					`Le document Calameo n'a pas pu être chargé (réponse vide).`
				);
			}

			let data;

			try {
				data = JSON.parse(text);
			} catch (error) {
				const sanitized =
					text.length > MAX_ERROR_RESPONSE_LENGTH
						? `${text.slice(0, MAX_ERROR_RESPONSE_LENGTH)}…(tronqué)`
						: text;

				console.error('Réponse backend :', sanitized);

				throw new Error(
					`Réponse JSON invalide : ${error.message}`
				);
			}

			if (!response.ok) {
				throw new Error(
					`Erreur HTTP ${response.status} (${data?.error || 'Erreur inconnue'}).`
				);
			}

			if (data?.status !== 'ok') {
				console.error(data);
				throw new Error(`Erreur dans la réponse Calameo.`);
			}

			return {
				data,
				headers: validateHeaders(response.headers)
			};
		}

		/* ───────────────────────────────
		   Main
		─────────────────────────────── */

		dom.form.addEventListener('submit', async (event) => {
			event.preventDefault();

			clearError();
			clearImages();
			setLoading(true);

			try {
				const { bkcode, searchParams } =
					getBookCode(dom.input.value);

				const apiUrl =
					buildApiUrl(bkcode, searchParams);

				const {
					data: book,
					headers
				} = await fetchBook(apiUrl);

				const documentInfo = book.content.document;

				setPrintPageSize(
					documentInfo.width,
					documentInfo.height
				);

				const totalPages = documentInfo.pages;

				const token = [
					`?_token_=exp=${headers.expires}`,
					`acl=${headers.path}`,
					`hmac=${headers.signature}`
				].join('~');

				const baseImageUrl =
					`${book.content.domains.secured.svg}${book.content.key}/`;

				let loaded = 0;

				dom.title.textContent = book.content.name;

				const handleLoadEnd = () => {
					loaded++;

					if (loaded >= totalPages) {
						window.print();

						setLoading(false);
						dom.title.textContent = APP_TITLE;

						return;
					}

					setCounter(loaded, totalPages);
				};

				setCounter(0, totalPages);

				const fragment = document.createDocumentFragment();

				for (let page = 1; page <= totalPages; page++) {
					const image = document.createElement('img');

					image.loading = 'eager';

					image.src =
						`${baseImageUrl}/p${page}.svgz${token}`;

					image.addEventListener('load', handleLoadEnd);

					image.addEventListener('error', (error) => {
						console.error(
							`Échec de chargement page ${page}`,
							error
						);

						handleLoadEnd();
					});

					fragment.appendChild(image);
				}

				dom.images.appendChild(fragment);

			} catch (error) {
				showError(
					error instanceof Error
						? error.message
						: String(error),
					error
				);
			}
		});
	</script>
</body>
</html>
