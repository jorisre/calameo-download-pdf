<!DOCTYPE html>
<html lang="fr">
<head>
	<title>Calameo Download PDF</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="title" content="Télécharger un document Calameo en PDF">
	<meta name="description" content="Télécharger un document Calameo au format PDF avec l'impression du navigateur web.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://comfoxx.github.io/calameo-download-pdf/">
	<meta property="og:title" content="Télécharger un document Calameo en PDF">
	<meta property="og:description" content="Télécharger un document Calameo au format PDF avec l'impression du navigateur web.">
	<style>
		/* ── Design Tokens – OLED Dark (Shadcn standard) ── */
		:root {
			--background: #000000;
			--foreground: #fafafa;
			--muted: #111111;
			--muted-foreground: #a1a1aa;
			--border: #27272a;
			--input: #18181b;
			--ring: #fafafa;
			--primary: #fafafa;
			--primary-foreground: #000000;
			--destructive: #ef4444;
			--radius: 9999px;
			--font-sans: Verdana, Geneva, Tahoma, sans-serif;
			--height-control: 2.5rem; /* 40 px – unified control height */
		}

		/* ── Reset & Base ── */
		*, *::before, *::after {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			background-color: var(--background);
			color: var(--foreground);
			font-family: var(--font-sans);
			font-size: 14px;
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			text-align: center;
		}

		/* ── Screen wrapper ── */
		.screen {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 2rem 1rem;
		}

		/* ── Print: hide images on screen ── */
		.print img {
			display: none;
		}

		/* ── Width-constrained elements ── */
		p, form, label {
			width: 100%;
			max-width: 28rem;
		}

		/* ── Logo image ── */
		.logo {
			width: 100%;
			max-width: 28rem;
			height: auto;
			margin: 0 0 1rem;
		}

		/* ── Description ── */
		p {
			font-size: 0.8125rem;
			color: var(--muted-foreground);
			margin: 0 0 1.5rem;
			text-align: center;
		}

		/* ── Form ── */
		form {
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: 1rem; /* 16 px */
		}

		/* ── Input ── */
		input[type="url"] {
			flex: 1;
			min-width: 0;
			height: var(--height-control);
			padding: 0 1rem;
			background-color: var(--input);
			color: var(--foreground);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			font-family: var(--font-sans);
			font-size: 0.875rem;
			outline: none;
			transition: border-color 0.15s, box-shadow 0.15s;
		}
		input[type="url"]::placeholder {
			color: var(--muted-foreground);
		}
		input[type="url"]:focus {
			border-color: var(--ring);
			box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
		}

		/* ── Button ── */
		button[type="submit"] {
			flex-shrink: 0;
			width: var(--height-control);
			height: var(--height-control);
			padding: 0;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			background-color: var(--primary);
			color: var(--primary-foreground);
			border: none;
			border-radius: var(--radius);
			cursor: pointer;
			transition: opacity 0.15s;
		}
		button[type="submit"]:hover {
			opacity: 0.88;
		}
		button[type="submit"]:focus-visible {
			outline: none;
			box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
		}
		button[type="submit"]:active {
			opacity: 0.76;
		}
		button[type="submit"]:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		.lucide-loader-circle {
			animation: spin 0.8s linear infinite;
		}

		/* ── Status label (error only) ── */
		label {
			display: none;
			font-size: 0.8125rem;
			color: var(--destructive);
			margin-top: 0.75rem;
			text-align: center;
		}
		label.error {
			display: block;
		}

		/* ── Print media ── */
		@media print {
			.print img {
				width: 100%;
				max-height: 100vh;
				page-break-after: always;
				page-break-inside: avoid;
				display: block;
			}
			.screen {
				display: none;
			}
		}
	</style>
	<style id="pageStyle"></style>
</head>
<body>
	<div class="screen">
		<img src="calameo-pdf-dl.jpeg" alt="Calameo PDF Downloader" class="logo">
		<p>
			Obtiens un PDF depuis ton document Calameo
		</p>
		<form>
			<input type="url" placeholder="https://www.calameo.com/calameo/read/00000000197005f4f7c58" required>
			<button type="submit" aria-label="Imprimer">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right-icon lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
			</button>
		</form>
		<label id="error-label"></label>
	</div>
	<div class="print" id="images"></div>
	<script type="module">
		const input = document.querySelector('input');
		const form = document.querySelector('form');
		const btn = document.querySelector('button[type="submit"]');
		const errorLabel = document.querySelector('#error-label');
		const images = document.querySelector('#images');
		const pageStyle = document.querySelector('#pageStyle');
		const title = document.querySelector('title');
		let hasFatalError = false;
		const MAX_ERROR_RESPONSE_LENGTH = 500;

		const ICON_ARROW = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-down-icon lucide-file-down"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>`;
		const ICON_LOADER = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-loader-icon lucide-loader"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>`;

		const setLoading = (loading) => {
			btn.disabled = loading;
			btn.innerHTML = loading ? ICON_LOADER : ICON_ARROW;
		};

		const showDocumentError = (message, originalError) => {
			if (hasFatalError) {
				if (originalError !== undefined) {
					console.error(originalError);
				}
				return;
			}
			hasFatalError = true;
			errorLabel.textContent = `Erreur : ${message}`;
			errorLabel.classList.add('error');
			setLoading(false);
			if (originalError !== undefined) {
				console.error(originalError);
			}
		};

		form.addEventListener('submit', async e => {
			e.preventDefault();

			errorLabel.classList.remove('error');
			errorLabel.textContent = '';
			hasFatalError = false;
			setLoading(true);

			while (images.firstChild) {
				images.firstChild.remove();
			}

			try {
				let sourceUrl;
				try {
					sourceUrl = new URL(input.value);
				} catch (_urlError) {
					throw new Error(`L'URL saisie est invalide.`);
				}
				const pathParts = sourceUrl.pathname.split('/').filter(Boolean);
				const bkcode = pathParts[pathParts.length - 1];
				if (!bkcode) {
					throw new Error(`Le code du document Calameo est introuvable dans l'URL saisie.`);
				}
				const host = window.location.hostname === 'comfoxx.github.io' ? 'https://comfoxx.fr/calameo-download-pdf/' : '';
				const params = new URLSearchParams(sourceUrl.search);
				params.set('bkcode', bkcode);
				const url = host + 'api/getbook.php?' + params.toString();
				const response = await fetch(url);
				const responseText = await response.text();
				if (responseText.trim() === '') {
					throw new Error(`Le document Calameo n'a pas pu être chargé (réponse vide).`);
				}
				let book;
				try {
					book = JSON.parse(responseText);
				} catch (jsonError) {
					const sanitizedResponse = responseText.length > MAX_ERROR_RESPONSE_LENGTH ? `${responseText.substring(0, MAX_ERROR_RESPONSE_LENGTH)}…(tronqué)` : responseText;
					console.error('Réponse brute du backend (tronquée):', sanitizedResponse);
					throw new Error(`Réponse JSON invalide : ${jsonError.message}. Voir la console pour la réponse brute.`);
				}

				if (!response.ok) {
					const backendError = book?.error || response.statusText || 'Erreur inconnue';
					if (book?.details) {
						console.error('Détails backend:', book.details);
					}
					throw new Error(`Erreur HTTP ${response.status} (${backendError}).`);
				}

				const expires = response.headers.get("X-Calameo-Hash-Expires");
				const path = response.headers.get("X-Calameo-Hash-Path");
				const signature = response.headers.get("X-Calameo-Hash-Signature");
				if (!expires || !path || !signature) {
					const missingHeaders = [];
					if (!expires) missingHeaders.push('X-Calameo-Hash-Expires');
					if (!path) missingHeaders.push('X-Calameo-Hash-Path');
					if (!signature) missingHeaders.push('X-Calameo-Hash-Signature');
					throw new Error(`En-têtes Calameo manquants : ${missingHeaders.join(', ')}.`);
				}

				if (book === undefined || book === null) {
					throw new Error(`Le document Calameo n'a pas pu être chargé (JSON vide).`);
				}
				if (book.status !== 'ok') {
					console.error('Réponse Calameo en erreur:', book);
					throw new Error(`Erreur dans la réponse Calameo.`);
				}

				const width = book.content.document.width + 'px';
				const height = book.content.document.height + 'px';
				pageStyle.innerHTML = `
					@page {
						size: ${width} ${height};
						margin: 0;
					}`;

				const max = book.content.document.pages;
				let loadedImages = 0;
				let imageErrors = 0;

				title.textContent = book.content.name;

				const load = () => {
					loadedImages++;
					if (loadedImages >= max) {
						window.print();
						setLoading(false);
						title.textContent = 'Calameo Download PDF';
					}
				};

				const sign = ["?_token_=exp=" + expires, "acl=" + path, "hmac=" + signature].join("~");
				const imageUrl = book.content.domains.secured.svg + book.content.key + '/';
				for (let page = 1; page <= max; page++) {
					const src = `${imageUrl}/p${page}.svgz${sign}`;
					const image = document.createElement('img');
					image.addEventListener('load', () => load());
					image.addEventListener('error', (event) => {
						imageErrors++;
						console.error(`Échec de chargement de l'image page ${page}.`, event);
						load();
					});
					image.src = src;
					images.appendChild(image);
				}
			} catch (err) {
				showDocumentError(err instanceof Error ? err.message : String(err), err);
				return null;
			}
		});
	</script>
</body>
</html>
